<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rent Calculator</title>
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#16202b;--mute:#5d6b79;--line:#d5dce3;--acc:#1f5eff;--accink:#fff;--warn:#b42318}
@media (prefers-color-scheme:dark){:root{--bg:#10151b;--card:#18202a;--ink:#e8edf2;--mute:#97a4b2;--line:#2c3744;--acc:#6b9bff;--accink:#08101c;--warn:#ff8a7a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,"Times New Roman",serif}
main{max-width:760px;margin:0 auto;padding:24px 16px 56px}
h1{font-size:2rem;margin:8px 0 4px;letter-spacing:-.01em}
h2{font-size:1.15rem;margin:0 0 12px}
.sub{color:var(--mute);margin:0 0 24px}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px}
input,button{font:inherit;color:inherit}
input{background:transparent;border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0}
input:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.row{display:flex;gap:8px;margin-bottom:8px;align-items:center;flex-wrap:wrap}
.row input[type=text]{flex:2 1 120px}.row input[type=number]{flex:1 1 80px}
.row label{color:var(--mute);font-size:.9rem;flex:1 1 100%}
button{cursor:pointer;border:1px solid var(--line);background:transparent;border-radius:6px;padding:8px 12px}
button.go{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:700}
button.x{padding:8px 10px;color:var(--mute)}
.hint{color:var(--mute);font-size:.88rem;margin:4px 0 0}
.err{color:var(--warn);min-height:1.4em;margin:8px 0 0}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.92rem}
th,td{padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left;font-family:Georgia,serif}
tfoot td,td.t{font-weight:700}
.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.excl{display:flex;gap:10px;flex-wrap:wrap;flex:1 1 100%;font-size:.88rem;color:var(--mute)}
.excl label{display:flex;gap:4px;align-items:center;flex:0 0 auto}
</style>
</head>
<body>
<main>
<h1>Rent Calculator</h1>
<p class="sub">Split rent, utilities and shared costs between flatmates. Everything stays in your browser.</p>

<section>
<h2>Flatmates</h2>
<div id="members"></div>
<button id="addM">Add flatmate</button>
<p class="hint">Rent weight 1 means an equal share. Give a bigger room a higher number, like 1.2.</p>
</section>

<section>
<h2>Monthly costs</h2>
<div class="row"><label for="rent">Rent</label><input id="rent" type="number" min="0" step="0.01" value="1500"></div>
<div id="exps"></div>
<button id="addE">Add expense</button>
<p class="hint">Tick a name under an expense to leave that person out of it.</p>
</section>

<p class="err" id="err" role="alert"></p>
<button class="go" id="calc">Calculate shares</button>

<section id="out" hidden style="margin-top:16px">
<h2>Itemized shares</h2>
<div class="scroll"><table id="tbl"></table></div>
<div class="actions"><button id="csv">Download CSV</button><button id="json">Download JSON</button></div>
</section>
</main>

<script>
const $=s=>document.querySelector(s);
const members=[{name:"Asha",w:1.2},{name:"Ben",w:1},{name:"Chen",w:1}];
const exps=[{name:"Electricity",amt:90.5,ex:[]},{name:"Water",amt:40,ex:[]},{name:"Internet",amt:60,ex:[]}];
let result=null;

function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

function draw(){
  $("#members").innerHTML=members.map((m,i)=>`<div class="row">
    <input type="text" data-m="${i}" data-k="name" value="${esc(m.name)}" aria-label="Name">
    <input type="number" data-m="${i}" data-k="w" value="${m.w}" min="0.1" step="0.05" aria-label="Rent weight">
    <button class="x" data-rm="${i}" aria-label="Remove ${esc(m.name)}">Remove</button></div>`).join("");
  $("#exps").innerHTML=exps.map((e,i)=>`<div class="row">
    <input type="text" data-e="${i}" data-k="name" value="${esc(e.name)}" aria-label="Expense name">
    <input type="number" data-e="${i}" data-k="amt" value="${e.amt}" min="0" step="0.01" aria-label="Amount">
    <button class="x" data-re="${i}" aria-label="Remove ${esc(e.name)}">Remove</button>
    <div class="excl">Leave out: ${members.map((m,j)=>`<label><input type="checkbox" data-x="${i}" data-j="${j}" ${e.ex.includes(j)?"checked":""}>${esc(m.name)}</label>`).join("")}</div></div>`).join("");
}

// Split cents by weight so shares always add up to the exact total.
function split(totalCents,weights){
  const sum=weights.reduce((a,b)=>a+b,0);
  const raw=weights.map(w=>totalCents*w/sum);
  const out=raw.map(Math.floor);
  let left=totalCents-out.reduce((a,b)=>a+b,0);
  raw.map((r,i)=>[r-out[i],i]).sort((a,b)=>b[0]-a[0]).slice(0,left).forEach(([,i])=>out[i]++);
  return out;
}

function compute(){
  const names=members.map(m=>m.name.trim());
  if(!members.length) throw "Add at least one flatmate.";
  if(names.some(n=>!n)) throw "Every flatmate needs a name.";
  if(new Set(names).size<names.length) throw "Flatmate names must be different.";
  if(members.some(m=>!(m.w>0))) throw "Rent weights must be above 0.";
  const rent=Math.round(parseFloat($("#rent").value)*100);
  if(!(rent>=0)) throw "Enter the monthly rent.";
  const cols=["Rent"],rows=names.map(()=>[0]);
  split(rent,members.map(m=>+m.w)).forEach((c,i)=>rows[i][0]=c);
  exps.forEach(e=>{
    const amt=Math.round(parseFloat(e.amt)*100);
    if(!e.name.trim()||!(amt>=0)) throw "Each expense needs a name and an amount.";
    const inc=members.map((_,j)=>j).filter(j=>!e.ex.includes(j));
    if(!inc.length) throw `"${e.name}" leaves everyone out.`;
    cols.push(e.name.trim());
    const col=members.map(()=>0);
    split(amt,inc.map(()=>1)).forEach((c,k)=>col[inc[k]]=c);
    rows.forEach((r,i)=>r.push(col[i]));
  });
  return {names,cols,rows};
}

const fmt=c=>(c/100).toFixed(2);

function render(r){
  const tot=r.rows.map(x=>x.reduce((a,b)=>a+b,0));
  const colTot=r.cols.map((_,k)=>r.rows.reduce((a,x)=>a+x[k],0));
  $("#tbl").innerHTML=`<thead><tr><th>Name</th>${r.cols.map(c=>`<th>${esc(c)}</th>`).join("")}<th>Total</th></tr></thead>
  <tbody>${r.names.map((n,i)=>`<tr><td>${esc(n)}</td>${r.rows[i].map(c=>`<td>${fmt(c)}</td>`).join("")}<td class="t">${fmt(tot[i])}</td></tr>`).join("")}</tbody>
  <tfoot><tr><td>Household</td>${colTot.map(c=>`<td>${fmt(c)}</td>`).join("")}<td>${fmt(tot.reduce((a,b)=>a+b,0))}</td></tr></tfoot>`;
  r.tot=tot;
  $("#out").hidden=false;
}

function save(name,text,type){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([text],{type}));
  a.download=name;a.click();URL.revokeObjectURL(a.href);
}

document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.m!==undefined){const m=members[t.dataset.m];m[t.dataset.k]=t.dataset.k==="w"?parseFloat(t.value):t.value}
  if(t.dataset.e!==undefined){const x=exps[t.dataset.e];x[t.dataset.k]=t.value}
  if(t.dataset.x!==undefined){const x=exps[t.dataset.x],j=+t.dataset.j;x.ex=t.checked?[...x.ex,j]:x.ex.filter(v=>v!==j)}
});
document.addEventListener("change",e=>{if(e.target.dataset.m==="name"||e.target.dataset.k==="name"&&e.target.dataset.m!==undefined)draw()});
document.addEventListener("click",e=>{
  const d=e.target.dataset;
  if(d.rm!==undefined){const i=+d.rm;members.splice(i,1);exps.forEach(x=>x.ex=x.ex.filter(j=>j!==i).map(j=>j>i?j-1:j));draw()}
  if(d.re!==undefined){exps.splice(+d.re,1);draw()}
});
$("#addM").onclick=()=>{members.push({name:"",w:1});draw()};
$("#addE").onclick=()=>{exps.push({name:"",amt:0,ex:[]});draw()};
$("#calc").onclick=()=>{
  try{$("#err").textContent="";result=compute();render(result)}
  catch(m){$("#err").textContent=m;$("#out").hidden=true}
};
$("#csv").onclick=()=>{
  const q=s=>`"${String(s).replace(/"/g,'""')}"`;
  const lines=[["Name",...result.cols,"Total"].map(q).join(",")];
  result.names.forEach((n,i)=>lines.push([q(n),...result.rows[i].map(fmt),fmt(result.tot[i])].join(",")));
  save("summary.csv",lines.join("\n"),"text/csv");
};
$("#json").onclick=()=>{
  const o={};
  result.names.forEach((n,i)=>{o[n]={};result.cols.forEach((c,k)=>o[n][c]=+fmt(result.rows[i][k]));o[n].Total=+fmt(result.tot[i])});
  save("summary.json",JSON.stringify(o,null,2),"application/json");
};
draw();
</script>
</body>
</html>
